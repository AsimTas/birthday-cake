<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Doğum Günün Kutlu Olsun! 🎂✨</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Google Fonts: Caveat & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: #000000 !important;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    .handwriting {
      font-family: 'Caveat', cursive;
    }

    /* Mum Alevi Parıltısı */
    @keyframes flameGlowPulse {
      0%, 100% {
        opacity: 0.75;
        transform: translate(-50%, -50%) scale(0.95);
        filter: blur(20px);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.15);
        filter: blur(28px);
      }
    }

    .flame-glow {
      animation: flameGlowPulse 1.1s infinite ease-in-out;
    }

    /* Pasta Katman Sahnesi */
    .cake-container {
      position: relative;
      width: 100%;
      max-width: 390px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cake-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      transition: opacity 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: opacity, transform;
    }

    .layer-hidden {
      opacity: 0;
      transform: scale(0.97);
    }

    .layer-active {
      opacity: 1;
      transform: scale(1);
    }

    /* Duman süzülme animasyonu */
    .smoke-float {
      animation: smokeRise 0.6s ease-out forwards;
    }

    @keyframes smokeRise {
      0% {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Kalpler & Yıldızlar patlama efekti */
    .celebrate-pop {
      animation: popIn 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.92);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Pastanın üstüne yumuşakça yerleşen mesaj */
    .overlay-message {
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>

<body class="bg-black min-h-[100dvh] flex flex-col items-center justify-between p-4 relative">

  <!-- Ana Taşıyıcı Ekran (iPhone 14 için optimize: 390px) -->
  <main id="interactiveScreen" class="w-full max-w-[390px] mx-auto min-h-[100dvh] flex flex-col items-center justify-between py-6 relative z-10 cursor-pointer">

    <!-- ÜST BAŞLIK -->
    <div id="headingArea" class="text-center pt-2 transition-opacity duration-500">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-neutral-900 border border-neutral-800 text-[11px] font-semibold tracking-wider text-purple-300 uppercase shadow-lg mb-2">
        ✨ Sana Özel Bir Sürpriz
      </span>
      <h1 class="text-2xl font-black tracking-tight text-white">
      </h1>
    </div>

    <!-- ORTA ALAN: PASTA VE ÜSTÜNE GELEN MESAJ -->
    <div id="cakeStage" class="relative flex flex-col items-center justify-center w-full my-auto">
      
      <div class="cake-container">
        <!-- Mum Işığı -->
        <div id="candleAura" class="flame-glow absolute z-20 w-28 h-28 bg-amber-500/35 rounded-full pointer-events-none" style="top: 25%; left: 50%;"></div>

        <!-- 1. Katman: Mum Yanan -->
        <img 
          id="cake1" 
          src="cake1.png" 
          alt="Yanan Pasta" 
          class="cake-layer layer-active"
        />

        <!-- 2. Katman: Sönen Duman & İkon -->
        <img 
          id="cake2" 
          src="cake2.png" 
          alt="Sönen Mum ve Duman" 
          class="cake-layer layer-hidden"
        />

        <!-- 3. Katman: Kalpler & Yıldızlar -->
        <img 
          id="cake3" 
          src="cake3.png" 
          alt="Kalpler ve Yıldızlar" 
          class="cake-layer layer-hidden"
        />

        <!-- PASTAYLA BİRLİKTE ÜSTÜNDE BELİREN MESAJ (Yeni sayfa açmaz) -->
        <div id="cakeMessage" class="overlay-message absolute inset-0 flex flex-col items-center justify-center px-4 text-center opacity-0 scale-95 pointer-events-none z-30">
          <div class="bg-black/80 backdrop-blur-md border border-purple-500/30 rounded-2xl p-4 shadow-[0_10px_35px_rgba(0,0,0,0.9)] max-w-[340px] pointer-events-auto">
            <span class="text-2xl mb-1 block">💜</span>
            <h2 class="text-lg font-extrabold text-white mb-0.5">
               Melek🪽
            </h2>
            <p class="text-[11px] text-purple-300 font-semibold tracking-wider uppercase mb-2">
              
            </p>
            <p class="handwriting text-xl text-purple-100 leading-snug mb-2">
              "Doğum Günün kutlu olsun canım, 
              Yeni yaşında birlikte çoooooook mutlu olmak dileğiyle
              🫶🫶🫶"
            </p>
            <p class="text-[11px] text-neutral-300 leading-relaxed mb-3">
              
            </p>
            
            <button id="resetButton" type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-neutral-900 hover:bg-neutral-800 active:scale-95 border border-purple-500/30 rounded-lg text-[11px] font-semibold text-purple-200 transition">
              <span>🔁</span> Tekrar Üfle
            </button>
          </div>
        </div>

      </div>

    </div>

    <!-- ALT İPUCU -->
    <div id="footerHint" class="flex flex-col items-center pb-2 transition-opacity duration-300">
      <div id="actionHint" class="flex items-center gap-2 bg-neutral-950 border border-neutral-800 px-5 py-2.5 rounded-full shadow-2xl transition transform active:scale-95 animate-pulse">
        <span class="text-base">🕯️</span>
        <span class="text-xs font-semibold text-neutral-200 tracking-wide">
          DOKUN!!!
        </span>
        <span class="text-[10px] bg-amber-400 text-amber-950 font-black px-2 py-0.5 rounded-full tracking-wider">
          DOKUN
        </span>
      </div>
      <p id="actionSub" class="text-[10px] text-neutral-500 mt-2">
        (Ekranda herhangi bir yere dokunabilirsin)
      </p>
    </div>

  </main>

  <script>
    /* Web Audio API - Ses Sentezleyici */
    const SoundFx = {
      ctx: null,

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      blowCandle() {
        try {
          this.init();
          const bufferSize = this.ctx.sampleRate * 0.4;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * 0.3;
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(750, this.ctx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.38);
          filter.Q.value = 1.2;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start();
        } catch (e) {
          console.warn("Ses hatası:", e);
        }
      },

      playCelebrationChime() {
        try {
          this.init();
          const notes = [523.25, 659.25, 783.99, 987.77, 1046.50];
          const startTime = this.ctx.currentTime + 0.05;

          notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, startTime + i * 0.1);

            gain.gain.setValueAtTime(0, startTime + i * 0.1);
            gain.gain.linearRampToValueAtTime(0.2, startTime + i * 0.1 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + i * 0.1 + 0.5);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(startTime + i * 0.1);
            osc.stop(startTime + i * 0.1 + 0.55);
          });
        } catch (e) {
          console.warn("Melodi hatası:", e);
        }
      }
    };

    let isBlown = false;

    const interactiveScreen = document.getElementById('interactiveScreen');
    const candleAura = document.getElementById('candleAura');
    const footerHint = document.getElementById('footerHint');
    const cakeMessage = document.getElementById('cakeMessage');
    const resetButton = document.getElementById('resetButton');

    const cake1 = document.getElementById('cake1');
    const cake2 = document.getElementById('cake2');
    const cake3 = document.getElementById('cake3');

    function launchConfettiBurst() {
      confetti({
        particleCount: 60,
        spread: 70,
        origin: { y: 0.55 },
        colors: ['#c084fc', '#e879f9', '#fbbf24', '#f472b6', '#ffffff']
      });

      setTimeout(() => {
        confetti({
          particleCount: 35,
          angle: 60,
          spread: 55,
          origin: { x: 0.1, y: 0.6 },
          colors: ['#a855f7', '#fbbf24', '#fbcfe8']
        });
        confetti({
          particleCount: 35,
          angle: 120,
          spread: 55,
          origin: { x: 0.9, y: 0.6 },
          colors: ['#c084fc', '#f472b6', '#ffffff']
        });
      }, 180);
    }

    function triggerBlowAction() {
      if (isBlown) return;
      isBlown = true;

      // 1. ADIM: Mumu söndür & duman karesine geç
      SoundFx.blowCandle();
      candleAura.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
      candleAura.style.opacity = '0';
      candleAura.style.transform = 'translate(-50%, -50%) scale(0.2)';

      cake1.classList.remove('layer-active');
      cake1.classList.add('layer-hidden');

      cake2.classList.remove('layer-hidden');
      cake2.classList.add('layer-active', 'smoke-float');

      footerHint.style.opacity = '0';
      footerHint.style.pointerEvents = 'none';

      // 2. ADIM: Kalpler & yıldızlar karesine geç
      setTimeout(() => {
        cake2.classList.remove('layer-active', 'smoke-float');
        cake2.classList.add('layer-hidden');

        cake3.classList.remove('layer-hidden');
        cake3.classList.add('layer-active', 'celebrate-pop');

        SoundFx.playCelebrationChime();
        launchConfettiBurst();

        // 3. ADIM: Mesaj pastanın üstünde açılsın
        setTimeout(() => {
          cakeMessage.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
          cakeMessage.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
        }, 500);

      }, 600);
    }

    interactiveScreen.addEventListener('click', (e) => {
      if (e.target.closest('#resetButton') || e.target.closest('#cakeMessage')) return;
      triggerBlowAction();
    });

    resetButton.addEventListener('click', (e) => {
      e.stopPropagation();
      isBlown = false;

      // Mesajı gizle
      cakeMessage.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
      cakeMessage.classList.add('opacity-0', 'scale-95', 'pointer-events-none');

      // Başa dön
      setTimeout(() => {
        cake3.classList.remove('layer-active', 'celebrate-pop');
        cake3.classList.add('layer-hidden');

        cake2.classList.remove('layer-active', 'smoke-float');
        cake2.classList.add('layer-hidden');

        cake1.classList.remove('layer-hidden');
        cake1.classList.add('layer-active');

        candleAura.style.opacity = '0.9';
        candleAura.style.transform = 'translate(-50%, -50%) scale(1)';

        footerHint.style.opacity = '1';
        footerHint.style.pointerEvents = 'auto';
      }, 300);
    });
  </script>
</body>
</html>
